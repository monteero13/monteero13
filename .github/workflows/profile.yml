name: Build profile

on:
  schedule:
    - cron: "17 4 * * *"   # daily refresh of project stars
  workflow_dispatch:
  push:
    branches: [master, main]
    paths:
      - "profile.toml"
      - "scripts/**"
      - ".github/workflows/profile.yml"

permissions:
  contents: write

# One build at a time, so two runs never race on `git push`.
concurrency:
  group: profile-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # PROFILE_TOKEN (optional) is a fine-grained PAT with read-only access.
      # Without it the built-in token is used and the contribution / streak
      # tiles are still drawn when GraphQL allows it, skipped otherwise.
      - name: Build README and assets
        env:
          GITHUB_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
        run: python scripts/build.py

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README*.md assets/generated
          if git diff --staged --quiet; then
            echo "nothing changed"
            exit 0
          fi
          git commit -m "chore: rebuild profile from profile.toml"
          git pull --rebase
          git push
