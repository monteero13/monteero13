]

# -----------------------------------------------------------------------------
#  Proyectos. Estrellas y lenguaje vienen de la API en cada build. Un repo
#  privado se dibuja igual con estos datos, sin enlace (salvo que pongas `url`).
# -----------------------------------------------------------------------------
[[projects]]
repo = "edowl"
tags = ["rdf", "dcat", "odrl"]
description.en = "Validates and transforms JSON data catalogs into RDF knowledge graphs compliant with European standards."
description.es = "Valida y transforma catálogos de datos JSON en grafos de conocimiento RDF conformes a los estándares europeos."

[[projects]]
repo = "No-BNo-Good"
tags = ["etl", "json-ld"]
description.en = "High-performance Python ETL that cleans, skolemizes and batch-processes JSON-LD graphs full of blank nodes."
description.es = "ETL en Python de alto rendimiento que limpia, skolemiza y procesa por lotes grafos JSON-LD con nodos en blanco."

[[projects]]
repo = "Semanti-View"
tags = ["ontology", "sparql"]
description.en = "Applied semantic web: JSON-to-HTML conversion, ontology design in Protégé and advanced SPARQL."
description.es = "Web semántica aplicada: conversión de JSON a HTML, ontologías en Protégé y SPARQL avanzado."

[[projects]]
repo = "Neo-Biotic"
tags = ["data-mining", "oncology"]
description.en = "Data mining on the impact of antibiotics during neoadjuvant treatment in breast cancer patients."
description.es = "Minería de datos sobre el impacto de los antibióticos en el tratamiento neoadyuvante del cáncer de mama."

[[projects]]
repo = "Aniridia-SysBio"
tags = ["systems-biology", "pax6"]
description.en = "Systems biology of the genetic networks around Aniridia and the PAX6 gene."
description.es = "Biología de sistemas de las redes genéticas en torno a la Aniridia y el gen PAX6."

[[projects]]
repo = "KardiaProject"
tags = ["cardiology", "prediction"]
description.en = "Data analysis and predictive modelling focused on cardiovascular health."
description.es = "Análisis de datos y modelado predictivo centrado en la salud cardiovascular."

[[projects]]
repo     = "Alcolens"
language = "TypeScript"   # repo privado: la API no lo devuelve
tags     = ["saas", "auth", "realtime"]
# url    = "https://..."  # descomenta si tiene demo pública
description.en = "Full stack SaaS for patient management and auditing, with secure auth and real-time visualization."
description.es = "SaaS full stack para gestión y auditoría de pacientes, con autenticación segura y visualización en tiempo real."

[[projects]]
repo = "isa2024-healthcalc"
tags = ["oop", "design"]
description.en = "Applied health calculations and robust system design for a Software Engineering course."
description.es = "Cálculos de salud aplicados y diseño robusto para la asignatura de Ingeniería del Software."

# -----------------------------------------------------------------------------
#  Constantes vitales (estadísticas de GitHub)
# -----------------------------------------------------------------------------
[vitals]
languages_top     = 5
languages_exclude = ["HTML", "CSS", "TeX", "Jupyter Notebook", "Makefile", "Dockerfile"]

# -----------------------------------------------------------------------------
#  Títulos de sección. motif opcional: "helix" | "pulse" | "none"
# -----------------------------------------------------------------------------
[headings]
about    = { en = "about",     es = "sobre mí" }
stack    = { en = "stack",     es = "stack" }
skills   = { en = "genome",    es = "genoma" }
projects = { en = "work",      es = "proyectos" }
vitals   = { en = "vitals",    es = "constantes", motif = "pulse" }

[footer]
text = { en = "built from profile.toml · @{username}", es = "generado desde profile.toml · @{username}" }
