# =============================================================================
#  profile.toml — la única fuente de verdad del README del perfil.
#
#  Edita este archivo y ejecuta:      python scripts/build.py
#  (o haz push: el workflow .github/workflows/profile.yml lo regenera solo)
#  Vista previa local sin red:        python scripts/build.py --offline
#                                     y abre preview.html
#
#  Textos traducibles: cualquier texto puede ser
#     una cadena simple      ->  "Hola"            (igual en todos los idiomas)
#     o una tabla por idioma ->  { en = "Hi", es = "Hola" }
# =============================================================================

[profile]
username = "monteero13"
name     = "Alberto Montero"

# El primero genera README.md; el resto README.<código>.md
languages      = ["en", "es"]
language_names = { en = "English", es = "Español" }

# Orden de las secciones. Quita una línea para ocultarla.
# Disponible también: "skills" (genoma de habilidades, ver al final).
sections = ["banner", "links", "about", "stack", "projects", "vitals", "footer"]

# -----------------------------------------------------------------------------
#  Estilo. Minimalista: fondo nativo de GitHub, tipografía mono, un tono
#  crema para lo importante y un único acento para los pequeños detalles.
# -----------------------------------------------------------------------------
[style]
# Detalle al final del título de cada sección:
#   "flow" (mini grafo de agentes) | "helix" | "pulse" | "none"
# Se puede cambiar por sección en [headings].<sección>.motif
heading_motif = "flow"
numbered      = true

[theme]
font = "ui-sans-serif,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif"
mono = "ui-monospace,SFMono-Regular,'JetBrains Mono','Cascadia Code',Consolas,monospace"

[theme.dark]
strong = "#FFF8E8"   # crema: nombre, títulos, cifras
text   = "#C9D1D9"
muted  = "#7D8590"
line   = "#21262D"
faint  = "#30363D"
accent = "#F2777A"   # coral: sólo cursor, punto "live" y paquetes en movimiento

[theme.light]
strong = "#1F2328"
text   = "#424A53"
muted  = "#6E7781"
line   = "#D8DEE4"
faint  = "#C4CCD4"
accent = "#CF4A4A"

# -----------------------------------------------------------------------------
#  Cabecera generada (SVG, versión dark y light).
#  Para usar una imagen propia en su lugar, rellena [banner] más abajo.
# -----------------------------------------------------------------------------
[header]
status = { en = "AI intern @ DEKRA", es = "becario de IA en DEKRA" }
role   = { en = "AI & automation engineer · full stack developer", es = "Ingeniero de IA y automatización · desarrollador full stack" }
# Frases que se escriben una tras otra en el prompt
typing = [
  { en = "building agentic workflows with langgraph", es = "construyendo flujos agénticos con langgraph" },
  { en = "automating the boring parts of the job",    es = "automatizando lo repetitivo del día a día" },
  { en = "shipping full stack products end to end",   es = "creando productos full stack de punta a punta" },
]
# Etiquetas del mini grafo de agentes de la derecha ([] = sin etiquetas)
flow_labels = ["input", "agent", "tools", "output"]

# [banner]
# dark  = "assets/banner/banner-dark.gif"   # imagen en lugar de la cabecera
# light = "assets/banner/banner-light.gif"
# alt   = "Alberto Montero"

# -----------------------------------------------------------------------------
#  Enlaces: una línea de texto discreta bajo la cabecera
# -----------------------------------------------------------------------------
[[links]]
label = "linkedin"
url   = "https://es.linkedin.com/in/albeertomonterosolera"

[[links]]
label = "portfolio"
url   = "https://albertomontero.is-a.dev"

# [[links]]
# label = "email"
# url   = "mailto:tu@correo.com"

[links_options]
language_switch = true
visitor_counter = false

# -----------------------------------------------------------------------------
#  Sobre mí (Markdown). Corto: 3-4 líneas como mucho.
# -----------------------------------------------------------------------------
[about]
intro.en = "I build AI systems that do real work: agents, automations and the full stack products around them."
intro.es = "Construyo sistemas de IA que hacen trabajo real: agentes, automatizaciones y los productos full stack que los rodean."

[[about.points]]
text.en = "**Now** — AI & automation intern at **DEKRA**, designing agentic workflows with LangGraph and LangChain."
text.es = "**Ahora** — becario de IA y automatización en **DEKRA**, diseñando flujos agénticos con LangGraph y LangChain."

[[about.points]]
text.en = "**Build** — React / Next.js front ends, Python and Node back ends, data pipelines that feed the models."
text.es = "**Construyo** — front ends con React / Next.js, back ends en Python y Node, y pipelines de datos que alimentan los modelos."

[[about.points]]
text.en = "**Background** — Health Engineering at the University of Málaga, heading into a Master's in Software Engineering & AI."
text.es = "**Formación** — Ingeniería de la Salud en la Universidad de Málaga, de camino al Máster en Ingeniería del Software e IA."

# -----------------------------------------------------------------------------
#  Stack: iconos de skillicons.dev (ids: https://github.com/tandpfun/skill-icons#icons-list)
#  + una línea en texto para lo que no tiene icono allí.
# -----------------------------------------------------------------------------
[stack]
icons    = ["py", "ts", "react", "nextjs", "tailwind", "nodejs",
            "pytorch", "tensorflow", "docker", "git", "linux"]
per_line = 11
extra_label = { en = "also", es = "también" }
extra       = ["langgraph", "langchain", "qdrant", "neo4j", "rdf / sparql"]

# -----------------------------------------------------------------------------
#  Proyectos destacados (mejor pocos: 4 o 6). Estrellas y lenguaje vienen de la
#  API. Un repo privado se dibuja con estos datos y sin enlace (salvo `url`).
# -----------------------------------------------------------------------------
[[projects]]
repo     = "Alcolens"
language = "TypeScript"   # repo privado: la API no lo devuelve
tags     = ["saas", "auth", "realtime"]
# url    = "https://..."  # descomenta si tiene demo pública
description.en = "Full stack SaaS for patient management and auditing, with secure auth and real-time dashboards."
description.es = "SaaS full stack para gestión y auditoría de pacientes, con autenticación segura y dashboards en tiempo real."

[[projects]]
repo = "edowl"
tags = ["etl", "knowledge-graph"]
description.en = "Turns JSON data catalogs into validated RDF knowledge graphs that people and agents can query."
description.es = "Convierte catálogos JSON en grafos de conocimiento RDF validados que personas y agentes pueden consultar."

[[projects]]
repo = "No-BNo-Good"
tags = ["python", "pipeline"]
description.en = "High-performance Python ETL that cleans, skolemizes and batch-processes JSON-LD graphs."
description.es = "ETL en Python de alto rendimiento que limpia, skolemiza y procesa por lotes grafos JSON-LD."

[[projects]]
repo = "Neo-Biotic"
tags = ["data-mining", "health"]
description.en = "Data mining on the impact of antibiotics during neoadjuvant breast cancer treatment."
description.es = "Minería de datos sobre el impacto de los antibióticos en el tratamiento neoadyuvante del cáncer de mama."

# -----------------------------------------------------------------------------
#  Constantes vitales (estadísticas de GitHub)
# -----------------------------------------------------------------------------
[vitals]
languages_top     = 5
languages_exclude = ["HTML", "CSS", "TeX", "Jupyter Notebook", "Makefile", "Dockerfile"]

# -----------------------------------------------------------------------------
#  Títulos de sección. motif opcional: "flow" | "helix" | "pulse" | "none"
# -----------------------------------------------------------------------------
[headings]
about    = { en = "about",  es = "sobre mí" }
stack    = { en = "stack",  es = "stack" }
skills   = { en = "skills", es = "habilidades" }
projects = { en = "work",   es = "proyectos" }
vitals   = { en = "vitals", es = "actividad", motif = "pulse" }

[footer]
text = { en = "built from profile.toml · @{username}", es = "generado desde profile.toml · @{username}" }

# -----------------------------------------------------------------------------
#  Opcional: genoma de habilidades. Añade "skills" a `sections` para mostrarlo.
# -----------------------------------------------------------------------------
[[skills]]
group = { en = "ai", es = "ia" }
items = [
  { label = "LangGraph / LangChain", level = 80 },
  { label = "Python",                level = 90 },
  { label = "Machine Learning",      level = 75 },
]

[[skills]]
group = { en = "full stack", es = "full stack" }
items = [
  { label = "TypeScript",       level = 78 },
  { label = "React / Next.js",  level = 76 },
  { label = "SQL / Postgres",   level = 72 },
]
